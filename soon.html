<style>
:root{
  --bone:#F5F3EE;
  --sage-mist:#C9D6C2;   /* плашка рейтинга */
  --sage:#A2B599;
  --olive:#6E7F60;
  --olive-deep:#3F4A38;
  --ink:#1C211B;
  --ink-60:rgba(28,33,27,.60);

  --glass:rgba(64,60,54,.52);
  --glass-hover:rgba(64,60,54,.70);
  --blur:blur(12px) saturate(1.05);

  --font-ui:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --font-display:'Instrument Serif',Georgia,serif;
  --font-script:'Cormorant Garamond',Georgia,serif;

  --r-pill:999px;
  --r-sm:8px;
  --r-md:9px;
  --r-lg:10px;

  --ease:cubic-bezier(.22,.61,.36,1);
  --t:280ms;
}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-ui);
  background:var(--bone);
  color:var(--ink);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--bone);outline-offset:3px;border-radius:4px}


*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--bone);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--olive);outline-offset:3px;border-radius:4px}

.top{display:flex;align-items:center;justify-content:space-between;padding:20px 26px}
.top__back{
  display:inline-flex;align-items:center;gap:9px;height:40px;padding:0 16px 0 12px;
  border-radius:999px;background:rgba(28,33,27,.07);
  font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
  transition:background .28s;
}
.top__back:hover{background:rgba(28,33,27,.13)}
.top__back svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.top__mark{width:52px;color:var(--ink)}
.top__mark svg{display:block}
.lang{display:flex;background:rgba(28,33,27,.07);border-radius:999px;padding:3px}
.lang button{height:28px;padding:0 12px;border-radius:999px;font-size:11.5px;font-weight:500;color:var(--ink-60);transition:all .28s}
.lang button[aria-current="true"]{background:#fff;color:var(--ink)}

.mid{flex:1;display:grid;place-items:center;padding:20px 24px 70px}
.card{max-width:640px;text-align:center}
.card__pic{
  border-radius:6px;overflow:hidden;margin-bottom:44px;
  box-shadow:0 14px 44px rgba(20,24,18,.16);
  transform:rotate(-1.1deg);
}
.card__pic img{width:100%;display:block}
.card__eyebrow{
  font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--olive);margin-bottom:16px;font-weight:500;
}
.card h1{
  font-family:var(--font-display);font-weight:400;
  font-size:42px;line-height:1.16;margin-bottom:18px;
}
.card p{font-size:17px;line-height:1.62;color:var(--ink-60);max-width:470px;margin:0 auto 34px}
.card__cta{
  display:inline-block;height:50px;line-height:50px;padding:0 30px;
  background:var(--sage-mist);border-radius:5px;
  font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;
  text-decoration:none;transition:background .28s;
}
.card__cta:hover{background:#B9CBB2}
.card__alt{display:block;margin-top:22px;font-size:14.5px;color:var(--ink-60)}
.card__alt a{border-bottom:1px solid rgba(28,33,27,.3);text-decoration:none;padding-bottom:2px}
.card__alt a:hover{border-color:var(--olive)}

@media(max-width:620px){
  .top{padding:14px 16px}
  .top__mark{width:42px}
  .mid{padding:8px 16px 48px}
  .card__pic{margin-bottom:30px;transform:none}
  .card h1{font-size:27px;line-height:1.48}
  .card p{font-size:16px;line-height:1.5;margin-bottom:26px}
}

</style>

<script>
(() => {
  'use strict';
  const CS = {
    back: 'Zpět',
    title: 'Tato stránka se připravuje',
    body: 'Tuto část webu ještě píšeme. Vila ale stojí, pokoje jsou připravené a na každou zprávu odpovídáme.',
    cta: 'Zpět na vilu',
    alt: 'Nebo nám napište: <a href="mailto:info@vila-anezka.cz">info@vila-anezka.cz</a>'
  };

  const nodes = [...document.querySelectorAll('[data-t]')];
  nodes.forEach(n => n.dataset.en = n.innerHTML);

  const apply = lang => {
    nodes.forEach(n => n.innerHTML = (lang === 'cs' && CS[n.dataset.t]) ? CS[n.dataset.t] : n.dataset.en);
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang button')
      .forEach(b => b.setAttribute('aria-current', String(b.dataset.lang === lang)));
    try { localStorage.setItem('va-lang', lang); } catch (e) {}
  };

  document.querySelectorAll('.lang button').forEach(b =>
    b.addEventListener('click', () => apply(b.dataset.lang)));

  /* какой раздел запрошен — показываем над заголовком */
  const p = new URLSearchParams(location.search).get('p');
  if (p) document.getElementById('section').textContent = p.slice(0, 60);

  let saved = 'en';
  try { saved = localStorage.getItem('va-lang') || 'en'; } catch (e) {}
  if (saved === 'cs') apply('cs');
})();
</script>
